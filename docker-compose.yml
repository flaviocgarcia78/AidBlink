# AidBlink — docker-compose
#
# `docker compose up --build` reads a local `.env` file (if present) for the
# values below. Copy `.env.example` to `.env` and fill in a treasury address and
# a voucher secret first.
#
#   cp .env.example .env
#   docker compose up --build
#   open http://localhost:3000
#
# Note: NEXT_PUBLIC_* values are baked into the client bundle at build time, so
# changing them requires a rebuild: `docker compose build --no-cache`.

services:
  aidblink:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SOLANA_NETWORK: ${NEXT_PUBLIC_SOLANA_NETWORK:-devnet}
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_TREASURY_ADDRESS: ${AIDBLINK_TREASURY_ADDRESS:-}
        NEXT_PUBLIC_SOL_USD_RATE: ${NEXT_PUBLIC_SOL_USD_RATE:-150}
    image: aidblink:latest
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Runtime configuration.
      AIDBLINK_TREASURY_ADDRESS: ${AIDBLINK_TREASURY_ADDRESS:-}
      AIDBLINK_VOUCHER_SECRET: ${AIDBLINK_VOUCHER_SECRET:-aidblink-dev-secret-do-not-use-in-production}
      AIDBLINK_ANCHOR_SECRET_KEY: ${AIDBLINK_ANCHOR_SECRET_KEY:-}
      AIDBLINK_VOUCHER_TTL_DAYS: ${AIDBLINK_VOUCHER_TTL_DAYS:-30}
      # Mirrored for server-side rendering of links and labels.
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SOLANA_NETWORK: ${NEXT_PUBLIC_SOLANA_NETWORK:-devnet}
      NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      NEXT_PUBLIC_SOL_USD_RATE: ${NEXT_PUBLIC_SOL_USD_RATE:-150}
    volumes:
      # Persist the file-backed demo store across restarts.
      - aidblink-data:/app/.data
    restart: unless-stopped

volumes:
  aidblink-data:
